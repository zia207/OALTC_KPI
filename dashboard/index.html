<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OALTC KPI Dashboard (demo)</title>
  <style>
    :root {
      --nav: #2f6f73;
      --nav-hover: #256064;
      --bg: #f8fafb;
      --card: #fff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #059669;
      --warn: #d97706;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    aside {
      width: 260px;
      flex-shrink: 0;
      background: var(--nav);
      color: #fff;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    aside h1 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.75rem 0.5rem;
      line-height: 1.3;
      opacity: 0.95;
    }
    .nav-group {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.7;
      margin: 0.6rem 0.5rem 0.25rem;
    }
    aside button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: #fff;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
    }
    aside button:hover { background: rgba(255,255,255,0.12); }
    aside button.active { background: rgba(255,255,255,0.22); font-weight: 600; }

    main {
      flex: 1;
      padding: 1.25rem 1.5rem 2rem;
      overflow: auto;
      max-height: 100vh;
    }
    .panel { display: none; animation: fade 0.2s ease; }
    .panel.active { display: block; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    h2 { font-size: 1.35rem; margin: 0 0 0.5rem; font-weight: 700; color: var(--nav); }
    .lede { color: var(--muted); margin: 0 0 1rem; max-width: 65ch; line-height: 1.55; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.95rem;
    }
    .card h3 { margin: 0 0 0.35rem; font-size: 0.98rem; }
    .card p { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.45; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: 0.875rem;
    }
    th, td { padding: 0.55rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #eef6f7; color: var(--nav); font-weight: 600; }
    tr:last-child td { border-bottom: none; }

    .kpi-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .kpi-block header { margin-bottom: 0.6rem; }
    .kpi-block h3 { margin: 0; font-size: 1rem; color: var(--nav); }
    .view-tag {
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    pre.sql {
      margin: 0;
      padding: 0.75rem;
      background: #111827;
      color: #e5e7eb;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.74rem;
      line-height: 1.45;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.85rem;
    }
    .tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      border-left: 4px solid var(--nav);
    }
    .tile.on_target { border-left-color: var(--ok); }
    .tile.warning { border-left-color: var(--warn); }
    .tile.alert_t { border-left-color: var(--bad); }

    .tile .label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    .tile .value { font-size: 1.5rem; font-weight: 700; }
    .tile .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-alarm { background: #fee2e2; color: var(--bad); }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-ok { background: #d1fae5; color: #065f46; }

    .err {
      padding: 0.75rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #991b1b;
      font-size: 0.9rem;
    }

    /* —— Data Architecture & Pipeline (3.1) —— */
    .pipe-section-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    .pipe-main-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--nav);
      margin: 0 0 0.4rem;
      line-height: 1.25;
    }
    .pipe-subtitle {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      margin: 0 0 0.35rem;
      max-width: 72ch;
    }
    .pipe-last-run {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 1.15rem;
    }
    .pipe-last-run strong { color: var(--text); }

    .pipe-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .pipe-kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1rem 0.9rem;
    }
    .pipe-kpi-card .lbl {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }
    .pipe-kpi-card .big {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }
    .pipe-kpi-card .sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .pipe-kpi-card.tone-ok .big { color: var(--ok); }
    .pipe-kpi-card.tone-ok .sub { color: var(--ok); opacity: 0.85; }

    .pipe-layers-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 0.85rem;
    }

    .pipe-layer {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1rem 1rem 1rem;
      margin-bottom: 0.85rem;
      border-left: 5px solid var(--border);
    }
    .pipe-layer.layer-ok { border-left-color: var(--ok); }
    .pipe-layer.layer-warn { border-left-color: var(--warn); background: linear-gradient(90deg, rgba(217,119,6,0.06) 0%, var(--card) 12%); }

    .pipe-layer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .pipe-layer-head h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--nav);
      font-weight: 700;
    }
    .layer-pill {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }
    .layer-pill.ok { background: #d1fae5; color: #065f46; }
    .layer-pill.warn { background: #fef3c7; color: #92400e; }

    .pipe-layer-sum {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text);
    }
    .pipe-layer-callout {
      margin: 0.65rem 0 0;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      font-size: 0.84rem;
      color: #78350f;
    }
    .pipe-layer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.75rem;
      font-size: 0.82rem;
    }
    .pipe-layer-meta dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.25rem 1rem;
    }
    .pipe-layer-meta dt { color: var(--muted); font-weight: 500; }
    .pipe-layer-meta dd { margin: 0; font-family: ui-monospace, monospace; font-size: 0.8rem; }

    .pipe-breakdown-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0.75rem 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .compliance-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem 1.25rem;
      margin-top: 1.25rem;
    }
    .compliance-card > h4 {
      margin: 0 0 0.85rem;
      font-size: 1rem;
      color: var(--nav);
    }
    .compliance-y {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }
    .compliance-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.78rem;
    }
    .compliance-legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .compliance-legend i {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .stack-row {
      display: grid;
      grid-template-columns: minmax(140px, 200px) 1fr;
      gap: 0.65rem;
      align-items: center;
      margin-bottom: 0.65rem;
    }
    .stack-row:last-child { margin-bottom: 0; }
    .stack-label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text);
    }
    .stack-count {
      font-weight: 500;
      color: var(--muted);
    }
    .stack-track-wrap {
      position: relative;
    }
    .stack-track {
      display: flex;
      height: 26px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .stack-track .seg {
      height: 100%;
      min-width: 0;
      transition: width 0.25s ease;
    }
    .stack-axis {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* —— Data Quality Control (3.2) —— */
    .dq-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .dq-kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .dq-kpi-card .lbl {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }
    .dq-kpi-card .big {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .dq-kpi-card .sub { font-size: 0.82rem; margin-top: 0.35rem; color: var(--muted); }
    .dq-kpi-card.tone-ok .big { color: var(--ok); }
    .dq-kpi-card.tone-ok .sub { color: var(--ok); font-weight: 600; }
    .dq-kpi-card.tone-warn .big { color: var(--warn); }
    .dq-kpi-card.tone-warn .sub { color: var(--muted); }
    .dq-kpi-card.tone-bad .big { color: var(--bad); }
    .dq-kpi-card.tone-bad .sub { color: var(--muted); }
    .dq-kpi-card.tone-neutral .big { color: var(--text); }

    .dq-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem 1.15rem;
      margin-bottom: 1rem;
    }
    .dq-panel > h3 {
      margin: 0 0 0.9rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--nav);
    }

    .dq-dim-row { margin-bottom: 0.72rem; }
    .dq-dim-row:last-child { margin-bottom: 0; }
    .dq-dim-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.84rem;
      margin-bottom: 0.25rem;
      gap: 0.5rem;
    }
    .dq-dim-name { font-weight: 600; color: var(--text); }
    .dq-dim-pct { font-weight: 700; color: var(--nav); font-variant-numeric: tabular-nums; }
    .dq-dim-row.highlight .dq-dim-pct { color: var(--warn); }
    .dq-dim-track {
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .dq-dim-fill {
      height: 100%;
      border-radius: 999px;
      min-width: 0;
      transition: width 0.35s ease;
    }

    .dq-fail-row {
      display: grid;
      grid-template-columns: minmax(118px, 130px) 1fr;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .dq-fail-row:last-child { margin-bottom: 0; }
    .dq-fail-field {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--text);
    }
    .dq-fail-track {
      height: 18px;
      border-radius: 4px;
      background: #eef2f7;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .dq-fail-fill { height: 100%; border-radius: 3px; min-width: 0; }
    .dq-fail-axis {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .dq-table-wrap { overflow-x: auto; margin: 0 -0.15rem; }
    table.dq-table { font-size: 0.8125rem; }
    table.dq-table th { white-space: nowrap; }
    table.dq-table td { vertical-align: middle; }
    .dq-num { font-variant-numeric: tabular-nums; }

    .pill {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .pill-rate-bad { background: #fee2e2; color: #991b1b; }
    .pill-rate-warn { background: #ffedd5; color: #9a3412; }
    .pill-rate-ok { background: #d1fae5; color: #065f46; }
    .pill-status-review { background: #fef9c3; color: #854d0e; }

    .kpi-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.15rem;
    }
    .kpi-toolbar label { font-weight: 700; font-size: 0.88rem; color: var(--text); }
    #kpi-select {
      flex: 1;
      min-width: 240px;
      max-width: 520px;
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.9rem;
      color: var(--text);
    }
    #kpi-select:focus-visible {
      outline: 2px solid rgba(47, 111, 115, 0.35);
      outline-offset: 1px;
    }
    .kpi-mini-title {
      margin: 0 0 0.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--nav);
    }
    .kpi-demo-foot {
      margin: 0.45rem 0 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 72ch;
      line-height: 1.45;
    }

    /* —— Executive scorecard (4.1) —— */
    .exec-metric-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .exec-metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.95rem 1rem 0.85rem;
      border-top: 4px solid var(--border);
    }
    .exec-metric-card.tier-alert { border-top-color: var(--bad); }
    .exec-metric-card.tier-warning { border-top-color: var(--warn); }
    .exec-metric-card.tier-on_target { border-top-color: var(--ok); }

    .exec-metric-card .lbl {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.45rem;
    }
    .exec-metric-card .big {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .exec-val-ok { color: var(--ok); }
    .exec-val-warn { color: var(--warn); }
    .exec-val-bad { color: var(--bad); }

    .exec-metric-rows { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .exec-metric-rows div { display: flex; justify-content: space-between; gap: 0.5rem; margin-top: 0.2rem; }
    .exec-metric-rows span:first-child { color: var(--muted); }
    .exec-metric-rows span:last-child { font-weight: 600; color: var(--text); }
    .exec-metric-status { margin-top: 0.65rem; }

    .exec-chart-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .exec-chart-panel h3 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--nav);
    }
    .exec-chart-panel .sub {
      margin: 0 0 0.75rem;
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .exec-chart-svg {
      width: 100%;
      height: auto;
      display: block;
      max-height: 320px;
    }
    .exec-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .exec-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .exec-legend i {
      width: 22px;
      height: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* —— Program Performance Monitor (4.2) —— */
    .pm-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      align-items: flex-end;
      margin-bottom: 1rem;
    }
    .pm-field {
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }
    .pm-field label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .pm-field select {
      min-width: 180px;
      padding: 0.42rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.88rem;
      color: var(--text);
    }

    .pm-summary {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .pm-sum-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
    }
    .pm-sum-card .lb {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pm-sum-card .num {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 0.25rem;
    }
    .pm-sum-card.sum-ok .num { color: var(--ok); }
    .pm-sum-card.sum-warn .num { color: var(--warn); }
    .pm-sum-card.sum-alert .num { color: var(--bad); }
    .pm-sum-card.sum-neutral .num { color: var(--text); }

    .pm-table-shell {
      padding: 0;
      overflow: hidden;
    }
    .pm-table-shell > .pm-table-head {
      padding: 0.95rem 1rem 0.35rem;
    }
    .pm-table-shell h3 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--nav);
    }
    .pm-table-scroll {
      max-height: 420px;
      overflow: auto;
      border-top: 1px solid var(--border);
    }
    table.pm-table {
      font-size: 0.8rem;
    }
    table.pm-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef6f7;
      color: var(--nav);
      font-weight: 600;
      white-space: nowrap;
    }
    table.pm-table td,
    table.pm-table th {
      padding: 0.45rem 0.65rem;
    }
    .pm-num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .pm-txt-alert {
      font-weight: 700;
      color: var(--bad);
    }
    .pm-txt-warn {
      font-weight: 700;
      color: #c2410c;
    }
    .pm-txt-ok {
      color: var(--text);
      font-weight: 500;
    }
    .pm-scroll-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.35rem 0 0.5rem;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    /* —— Alert & Escalation System (4.3) —— */
    .as-chart-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-top: 1rem;
    }
    .as-chart-panel h3 { margin: 0 0 0.35rem; font-size: 0.98rem; color: var(--nav); }
    .as-chart-panel .sub { margin: 0 0 0.65rem; font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
    .as-timeline-svg {
      width: 100%;
      height: auto;
      display: block;
      max-height: 300px;
    }
    .as-timeline-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .as-timeline-legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .as-timeline-legend i {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    table.as-alert-table td.as-level { white-space: nowrap; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; flex-direction: row; flex-wrap: wrap; }
      aside h1 { width: 100%; }
      aside button { width: auto; flex: 1 1 40%; }
      main { max-height: none; }
    }
  </style>

  <script>
(function () {
  var buttons = document.querySelectorAll('aside button[data-tab]');
  var panels = document.querySelectorAll('main section.panel');

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showTab(id) {
    panels.forEach(function (p) { p.classList.toggle('active', p.id === id); });
    buttons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === id); });
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { showTab(btn.getAttribute('data-tab')); });
  });

  function b64Utf8Decode(b64) {
    var s = String(b64).replace(/\s+/g, '');
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  /**
   * Try fetch JSON; on failure parse embedded fallback.
   * @param {*} opts.b64 Use base64-encoded UTF-8 payload (formatter-safe vs raw JSON with long sql strings).
   */
  function loadJson(path, fallbackId, opts) {
    opts = opts || {};
    return fetch(path, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(path + ': HTTP ' + r.status);
        return r.json();
      })
      .catch(function (fetchErr) {
        var el = document.getElementById(fallbackId);
        if (!el || !el.textContent.trim()) throw fetchErr;
        try {
          var text = opts.b64 ? b64Utf8Decode(el.textContent) : el.textContent;
          return JSON.parse(text);
        } catch (parseErr) {
          throw fetchErr;
        }
      });
  }

  var pipeMount = document.getElementById('pipeline-mount');

  function renderPipeline(cfg) {
    var html = '';
    html += '<h2 class="pipe-main-title">' + esc(cfg.title || 'Pipeline') + '</h2>';
    html += '<p class="pipe-subtitle">' + esc(cfg.subtitle || '') + '</p>';
    if (cfg.lastRun) html += '<p class="pipe-last-run">' + esc(cfg.lastRun) + '</p>';

    html += '<div class="pipe-summary-grid">';
    (cfg.summary || []).forEach(function (s) {
      var tone = s.tone === 'ok' ? ' tone-ok' : '';
      html +=
        '<div class="pipe-kpi-card' + tone + '">' +
        '<div class="lbl">' + esc(s.label) + '</div>' +
        '<div class="big">' + esc(s.value) + '</div>' +
        (s.detail ? '<div class="sub">' + esc(s.detail) + '</div>' : '') +
        '</div>';
    });
    html += '</div>';

    html += '<h3 class="pipe-layers-heading">Pipeline layer status</h3>';

    (cfg.layers || []).forEach(function (L) {
      var cls = L.status === 'warn' ? 'layer-warn' : 'layer-ok';
      var pill = L.status === 'warn'
        ? '<span class="layer-pill warn">Warning</span>'
        : '<span class="layer-pill ok">OK</span>';
      html += '<article class="pipe-layer ' + cls + '">';
      html += '<div class="pipe-layer-head"><h3>' + esc(L.title || '') + '</h3>' + pill + '</div>';
      html += '<p class="pipe-layer-sum">' + esc(L.summary || '') + '</p>';
      if (L.warning) html += '<p class="pipe-layer-callout"><strong>WARNING:</strong> ' + esc(L.warning) + '</p>';

      if (L.breakdown && L.breakdown.length) {
        html += '<div class="pipe-breakdown-title">' + esc(L.breakdownTitle || 'Breakdown') + '</div>';
        html += '<div class="pipe-layer-meta"><dl>';
        L.breakdown.forEach(function (b) {
          html += '<dt>' + esc(b.label) + '</dt><dd>' + esc(String(b.value)) + '</dd>';
        });
        html += '</dl></div>';
      }

      if (L.stats && L.stats.length) {
        html += '<div class="pipe-layer-meta"><dl>';
        L.stats.forEach(function (st) {
          html += '<dt>' + esc(st.label) + '</dt><dd>' + esc(String(st.value)) + '</dd>';
        });
        html += '</dl></div>';
      }
      html += '</article>';
    });

    var ch = cfg.complianceChart;
    if (ch && ch.rows && ch.legend) {
      html += '<div class="compliance-card">';
      html += '<h4>' + esc(ch.title || '') + '</h4>';
      html += '<div class="compliance-y">' + esc(ch.yAxisLabel || '') + '</div>';

  function renderExecTrendSvg(rt) {
    var yMin = rt.yMin;
    var yMax = rt.yMax;
    var target = rt.targetPct;
    var vals = rt.values || [];
    var months = rt.months || [];
    var n = months.length;
    if (!n) return '';
    var w = 680;
    var h = 260;
    var padL = 46;
    var padR = 28;
    var padT = 28;
    var padB = 52;
    var iw = w - padL - padR;
    var ih = h - padT - padB;
    var xm = Math.max(n - 1, 1);

    function yScale(v) {
      return padT + ih * (1 - (v - yMin) / (yMax - yMin));
    }

    function xScale(i) {
      return padL + (iw * i) / xm;
    }

    var lc = rt.lineColor || '#2f6f73';
    var tc = rt.targetLineColor || '#9ca3af';
    var parts = [];

    parts.push(
      '<svg class="exec-chart-svg" viewBox="0 0 ' + w + ' ' + h +
        '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' +
        esc((rt.subheading || 'Trend chart').replace(/"/g, '')) +
        '">'
    );

    for (var g = yMin; g <= yMax; g++) {
      var gy = yScale(g);
      parts.push(
        '<line x1="' +
          padL +
          '" y1="' +
          gy +
          '" x2="' +
          (w - padR) +
          '" y2="' +
          gy +
          '" stroke="#eef2f7" stroke-width="1"/>'
      );
      parts.push(
        '<text x="' +
          (padL - 8) +
          '" y="' +
          (gy + 4) +
          '" font-size="10" fill="#9ca3af" text-anchor="end">' +
          g +
          '%</text>'
      );
    }

    var yt = yScale(target);
    parts.push(
      '<line x1="' +
        padL +
        '" y1="' +
        yt +
        '" x2="' +
        (w - padR) +
        '" y2="' +
        yt +
        '" stroke="' +
        tc +
        '" stroke-width="1.6" stroke-dasharray="7 6"/>'
    );

    var pathD = '';
    for (var i = 0; i < n; i++) {
      var xv = xScale(i);
      var yv = yScale(vals[i]);
      pathD += (i ? ' L ' : 'M ') + xv + ' ' + yv;
    }
    parts.push(
      '<path d="' +
        pathD +
        '" fill="none" stroke="' +
        lc +
        '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    );

    for (var ci = 0; ci < n; ci++) {
      var cxx = xScale(ci);
      var cyy = yScale(vals[ci]);
      parts.push(
        '<circle cx="' +
          cxx +
          '" cy="' +
          cyy +
          '" r="5" fill="#fff" stroke="' +
          lc +
          '" stroke-width="2"/>'
      );
    }

    for (var mi = 0; mi < n; mi++) {
      parts.push(
        '<text x="' +
          xScale(mi) +
          '" y="' +
          (h - 18) +
          '" font-size="10" fill="#64748b" text-anchor="middle">' +
          esc(months[mi]) +
          '</text>'
      );
    }

    parts.push('</svg>');
    return parts.join('');
  }

  function renderExecBarsSvg(eq) {
    var bars = eq.bars || [];
    var yMax = eq.yMax || 0.35;
    if (!bars.length) return '';

    var w = 680;
    var h = 284;
    var padL = 44;
    var padR = 16;
    var padT = 16;
    var padB = 88;
    var iw = w - padL - padR;
    var ih = h - padT - padB;
    var nb = bars.length;
    var gap = 12;
    var bw = (iw - gap * (nb - 1)) / nb;
    var baseY = padT + ih;

    var parts = [];
    parts.push(
      '<svg class="exec-chart-svg" viewBox="0 0 ' + w + ' ' + h +
        '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' +
        esc((eq.heading || 'Regional chart').replace(/"/g, '')) +
        '">'
    );

    var ticks = eq.yTicks || [0, 0.07, 0.14, 0.21, 0.28, 0.35];
    for (var ti = 0; ti < ticks.length; ti++) {
      var tv = ticks[ti];
      var gyl = padT + ih * (1 - tv / yMax);
      parts.push(
        '<line x1="' +
          padL +
          '" y1="' +
          gyl +
          '" x2="' +
          (w - padR) +
          '" y2="' +
          gyl +
          '" stroke="#eef2f7" stroke-width="1"/>'
      );
      parts.push(
        '<text x="' +
          (padL - 6) +
          '" y="' +
          (gyl + 3) +
          '" font-size="9" fill="#9ca3af" text-anchor="end">' +
          tv.toFixed(2) +
          '</text>'
      );
    }

    for (var bi = 0; bi < nb; bi++) {
      var val = bars[bi].value;
      var barH = ih * (val / yMax);
      var bx = padL + bi * (bw + gap);
      var by = baseY - barH;
      var fill = barTierFill(bars[bi].tier);
      parts.push(
        '<rect x="' +
          bx +
          '" y="' +
          by +
          '" width="' +
          bw +
          '" height="' +
          Math.max(barH, 2) +
          '" rx="4" fill="' +
          fill +
          '" opacity="0.92"/>'
      );
      parts.push(
        '<text x="' +
          (bx + bw / 2) +
          '" y="' +
          (by - 6) +
          '" font-size="9.5" font-weight="600" fill="#374151" text-anchor="middle">' +
          val.toFixed(2) +
          '</text>'
      );
      var rn = bars[bi].region;
      parts.push(
        '<text x="' +
          (bx + bw / 2) +
          '" y="' +
          (h - 54) +
          '" font-size="9" fill="#475569" text-anchor="middle">' +
          esc(rn) +
          '</text>'
      );
    }

    parts.push('</svg>');
    return parts.join('');
  }

    shell += '</select></div>';
    shell += '</div>';

    shell += '<div class="pm-summary">';
    shell +=
      '<div class="pm-sum-card sum-neutral"><div class="lb">' +
      esc(sumLab.shown || 'Facilities shown') +
      '</div><div class="num" id="pm-n-shown">0</div></div>';
    shell +=
      '<div class="pm-sum-card sum-ok"><div class="lb">' +
      esc(sumLab.onTarget || 'On target') +
      '</div><div class="num" id="pm-n-on">0</div></div>';
    shell +=
      '<div class="pm-sum-card sum-warn"><div class="lb">' +
      esc(sumLab.warning || 'Warning') +
      '</div><div class="num" id="pm-n-warn">0</div></div>';
    shell +=
      '<div class="pm-sum-card sum-alert"><div class="lb">' +
      esc(sumLab.alert || 'Alert') +
      '</div><div class="num" id="pm-n-alert">0</div></div>';
    shell += '</div>';

    shell += '<div class="dq-panel pm-table-shell">';
    shell += '<div class="pm-table-head"><h3>' + esc((cfg.tableTitle || 'Facility KPI rankings').toUpperCase()) + '</h3></div>';
    shell += '<div class="pm-table-scroll"><table class="dq-table pm-table"><thead><tr>';
    shell += '<th>Facility</th><th>Region</th><th class="pm-num">Beds</th>';
    shell += '<th class="pm-num">Readmit rate</th><th class="pm-num">Turnover %</th>';
    shell += '<th class="pm-num">Complaint resp.</th><th class="pm-num">Composite risk</th><th>Status</th>';
    shell += '</tr></thead><tbody id="pm-tbody"></tbody></table></div>';
    shell += '<div class="pm-scroll-hint" id="pm-scroll-hint" hidden>↓ Scroll for more facilities</div>';
    shell += '</div>';

    pmMount.innerHTML = shell;

    var regionSel = document.getElementById('pm-region');
    var statusSel = document.getElementById('pm-status');
    var sortSel = document.getElementById('pm-sort');
    var tbody = document.getElementById('pm-tbody');
    var hint = document.getElementById('pm-scroll-hint');

    function filteredSorted() {
      var reg = regionSel.value;
      var st = statusSel.value;
      var sort = sortSel.value;
      var list = rawRows.slice();
      if (reg && reg !== '__all') {
        list = list.filter(function (r) {
          return r.region === reg;
        });
      }
      if (st && st !== 'all') {
        list = list.filter(function (r) {
          return r.status === st;
        });
      }
      list.sort(function (a, b) {
        if (sort === 'facility') {
          return String(a.facility || '').localeCompare(String(b.facility || ''), undefined, { sensitivity: 'base' });
        }
        var ka;
        var kb;
        if (sort === 'readmit') {
          ka = a.readmit;
          kb = b.readmit;
        } else if (sort === 'turnover') {
          ka = a.turnover;
          kb = b.turnover;
        } else {
          ka = a.composite;
          kb = b.composite;
        }
        if (kb !== ka) return kb - ka;
        return String(a.facility || '').localeCompare(String(b.facility || ''));
      });
      return list;
    }

    function renderPm() {
      var list = filteredSorted();
      var nOn = 0;
      var nWarn = 0;
      var nAlert = 0;
      for (var i = 0; i < list.length; i++) {
        var s = String(list[i].status || '').toLowerCase();
        if (s === 'on_target') nOn++;
        else if (s === 'warning') nWarn++;
        else if (s === 'alert') nAlert++;
      }
      document.getElementById('pm-n-shown').textContent = String(list.length);
      document.getElementById('pm-n-on').textContent = String(nOn);
      document.getElementById('pm-n-warn').textContent = String(nWarn);
      document.getElementById('pm-n-alert').textContent = String(nAlert);

      var rowsHtml = '';
      list.forEach(function (r) {
        var sb = pmStatusBadge(r.status);
        rowsHtml += '<tr>';
        rowsHtml += '<td>' + esc(r.facility) + '</td>';
        rowsHtml += '<td>' + esc(r.region) + '</td>';
        rowsHtml += '<td class="pm-num">' + esc(String(r.beds != null ? r.beds : '')) + '</td>';
        rowsHtml +=
          '<td class="pm-num ' +
          pmTierCellClass(r.readmitTier) +
          '">' +
          esc(r.readmit != null ? r.readmit.toFixed(1) + '%' : '') +
          '</td>';
        rowsHtml +=
          '<td class="pm-num ' +
          pmTierCellClass(r.turnoverTier) +
          '">' +
          esc(r.turnover != null ? r.turnover.toFixed(1) + '%' : '') +
          '</td>';
        rowsHtml +=
          '<td class="pm-num ' +
          pmTierCellClass(r.complaintTier) +
          '">' +
          esc(r.complaintResp != null ? r.complaintResp.toFixed(1) + '%' : '') +
          '</td>';
        rowsHtml +=
          '<td class="pm-num ' +
          pmTierCellClass(r.compositeTier) +
          '">' +
          esc(r.composite != null ? r.composite.toFixed(1) : '') +
          '</td>';
        rowsHtml += '<td><span class="' + sb.cls + '">' + esc(sb.text) + '</span></td>';
        rowsHtml += '</tr>';
      });
      tbody.innerHTML = rowsHtml;
      if (hint) hint.hidden = list.length <= 12;
    }

    regionSel.addEventListener('change', renderPm);
    statusSel.addEventListener('change', renderPm);
    sortSel.addEventListener('change', renderPm);
    renderPm();
  }

  loadJson('program-monitor-config.json', 'fallback-program-monitor-b64', { b64: true })
    .then(initProgramMonitor)
    .catch(function (e) {
      if (pmMount) {
        pmMount.innerHTML =
          '<div class="err">Could not load program-monitor-config.json: ' + esc(e.message) + '</div>' +
          '<p class="lede">Serve over HTTP or regenerate <code>#fallback-program-monitor-b64</code> from <code>program-monitor-config.json</code>.</p>';
      }
    });

  var alertMount = document.getElementById('alert-system-mount');

  function renderAlertTimelineSvg(tl) {
    var weeks = tl.weeks || [];
    if (!weeks.length) return '';
    var yMax = tl.yMax || 16;
    var step = tl.yTicksStep || 4;
    var lg = tl.legend || [];
    var legendMap = {};
    lg.forEach(function (L) {
      legendMap[L.key] = L.color;
    });

    var w = 680;
    var h = 296;
    var padL = 44;
    var padR = 20;
    var padT = 28;
    var padB = 88;
    var iw = w - padL - padR;
    var ih = h - padT - padB;
    var nw = weeks.length;
    var gap = 14;
    var bw = nw > 0 ? (iw - gap * (nw - 1)) / nw : 24;
    var baseY = padT + ih;
    var hs = ih / yMax;

    var parts = [];
    parts.push(
      '<svg class="as-timeline-svg" viewBox="0 0 ' +
        w +
        ' ' +
        h +
        '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' +
        esc(String(tl.title || 'Timeline').replace(/"/g, '')) +
        '">'
    );

    for (var gv = 0; gv <= yMax; gv += step) {
      var gy = baseY - hs * gv;
      parts.push(
        '<line x1="' +
          padL +
          '" y1="' +
          gy +
          '" x2="' +
          (w - padR) +
          '" y2="' +
          gy +
          '" stroke="#eef2f7" stroke-width="1"/>'
      );
      parts.push(
        '<text x="' +
          (padL - 8) +
          '" y="' +
          (gy + 4) +
          '" font-size="10" fill="#9ca3af" text-anchor="end">' +
          gv +
          '</text>'
      );
    }

    for (var i = 0; i < nw; i++) {
      var week = weeks[i];
      var r = week.resolved || 0;
      var wa = week.warning || 0;
      var al = week.alert || 0;
      var x = padL + i * (bw + gap);
      var hR = hs * r;
      var hW = hs * wa;
      var hA = hs * al;
      var y = baseY;
      y -= hR;
      if (hR > 0.5) {
        parts.push(
          '<rect x="' +
            x +
            '" y="' +
            y +
            '" width="' +
            bw +
            '" height="' +
            Math.max(hR, 2) +
            '" rx="3" fill="' +
            (legendMap.resolved || '#059669') +
            '" opacity="0.95"/>'
        );
      }
      y -= hW;
      if (hW > 0.5) {
        parts.push(
          '<rect x="' +
            x +
            '" y="' +
            y +
            '" width="' +
            bw +
            '" height="' +
            Math.max(hW, 2) +
            '" rx="3" fill="' +
            (legendMap.warning || '#ea580c') +
            '" opacity="0.95"/>'
        );
      }
      y -= hA;
      if (hA > 0.5) {
        parts.push(
          '<rect x="' +
            x +
            '" y="' +
            y +
            '" width="' +
            bw +
            '" height="' +
            Math.max(hA, 2) +
            '" rx="3" fill="' +
            (legendMap.alert || '#dc2626') +
            '" opacity="0.95"/>'
        );
      }
      parts.push(
        '<text x="' +
          (x + bw / 2) +
          '" y="' +
          (h - 22) +
          '" font-size="10" fill="#64748b" text-anchor="middle">' +
          esc(week.label) +
          '</text>'
      );
    }

    if (tl.yAxisLabel) {
      parts.push(
        '<text transform="rotate(-90 ' +
          (padL - 24) +
          ',' +
          (padT + ih / 2) +
          ')" x="' +
          (padL - 24) +
          '" y="' +
          (padT + ih / 2) +
          '" font-size="10" fill="#6b7280" text-anchor="middle">' +
          esc(tl.yAxisLabel) +
          '</text>'
      );
    }

    parts.push('</svg>');
    return parts.join('');
  }

  function renderAlertSystem(cfg) {
    if (!alertMount) return;
    function sumToneCls(tone) {
      var t = String(tone || 'neutral').toLowerCase();
      if (t === 'alert' || t === 'bad') return ' sum-alert';
      if (t === 'warn') return ' sum-warn';
      if (t === 'ok') return ' sum-ok';
      return ' sum-neutral';
    }
    function levelBadge(lvl) {
      var s = String(lvl || '').toLowerCase();
      if (s === 'alert') return { cls: 'badge badge-alarm', text: 'ALERT' };
      return { cls: 'badge badge-warn', text: 'WARNING' };
    }

    var html = '';
    html += '<h2 class="pipe-main-title" style="margin-top:0">' + esc(cfg.title || '') + '</h2>';
    html += '<p class="pipe-subtitle">' + esc(cfg.subtitle || '') + '</p>';
    if (cfg.footnote) {
      html +=
        '<p class="lede" style="margin-top:-0.2rem;margin-bottom:0.9rem;font-size:0.82rem">' +
        esc(cfg.footnote) +
        '</p>';
    }

    html += '<div class="pm-summary">';
    (cfg.summary || []).forEach(function (s) {
      html +=
        '<div class="pm-sum-card' +
        sumToneCls(s.tone) +
        '">' +
        '<div class="lb">' +
        esc(s.label || '') +
        '</div>' +
        '<div class="num">' +
        esc(String(s.value == null ? '' : s.value)) +
        '</div>' +
        (s.detail
          ? '<div class="sub" style="font-size:0.72rem;color:var(--muted);margin-top:0.3rem;line-height:1.35">' +
            esc(s.detail) +
            '</div>'
          : '') +
        '</div>';
    });
    html += '</div>';

    html += '<div class="dq-panel" style="margin-top:1rem">';
    html += '<h3>' + esc(cfg.logTitle || 'Active Alert Log') + '</h3>';
    html += '<div class="dq-table-wrap"><table class="dq-table as-alert-table"><thead><tr>';
    var cols = cfg.columns || [];
    cols.forEach(function (c) {
      html += '<th>' + esc(c.label || c.key) + '</th>';
    });
    html += '</tr></thead><tbody>';
    (cfg.rows || []).forEach(function (row) {
      html += '<tr>';
      cols.forEach(function (c) {
        var key = c.key;
        var cell = row[key];
        if (key === 'level') {
          var b = levelBadge(cell);
          html += '<td class="as-level"><span class="' + b.cls + '">' + esc(b.text) + '</span></td>';
        } else {
          html += '<td>' + esc(cell == null ? '' : String(cell)) + '</td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';

    var tl = cfg.timeline;
    if (tl && tl.weeks && tl.weeks.length) {
      html += '<div class="as-chart-panel">';
      html += '<h3>' + esc(tl.title || '') + '</h3>';
      if (tl.subheading) html += '<p class="sub">' + esc(tl.subheading) + '</p>';
      html += renderAlertTimelineSvg(tl);
      html += '<div class="as-timeline-legend">';
      (tl.legend || []).forEach(function (leg) {
        html +=
          '<span><i style="background:' +
          esc(leg.color || '#ccc') +
          '"></i>' +
          esc(leg.label) +
          '</span>';
      });
      html += '</div></div>';
    }

    alertMount.innerHTML = html;
  }

  loadJson('alert-system-config.json', 'fallback-alert-system-b64', { b64: true })
    .then(renderAlertSystem)
    .catch(function (e) {
      if (alertMount) {
        alertMount.innerHTML =
          '<div class="err">Could not load alert-system-config.json: ' +
          esc(e.message) +
          '</div>' +
          '<p class="lede">Serve over HTTP or regenerate <code>#fallback-alert-system-b64</code> from <code>alert-system-config.json</code>.</p>';
      }
    });

  showTab('p31');
})();
  </script>
